apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-assistant
  namespace: ops-assistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-assistant-reader
  namespace: ops-assistant
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-assistant-reader
  namespace: ops-assistant
subjects:
  - kind: ServiceAccount
    name: ops-assistant
    namespace: ops-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-assistant-reader
