name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Exercise incident fixture
        run: python -m ops_assistant.cli --fixture tests/fixtures/problem_snapshot.json
      - name: Build container
        run: docker build -t ai-kubernetes-ops-assistant:ci .
